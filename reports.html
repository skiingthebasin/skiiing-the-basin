<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Keep hidden from search engines until ready to launch -->
<meta name="robots" content="noindex, nofollow">
<title>Trip Reports · Skiing the Basin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Sage Gray-Green Great Basin Palette */
  --paper: #e3e7e2;
  --paper-deep: #d4dad3;
  --ink: #29302c;
  --ink-soft: #48524c;
  --contour: #95a399;
  --contour-dark: #5c6b61;
  --accent: #d49b27;
  --accent-soft: #b58018;
  --water: #9ab0b8;

  /* Peak Marker Colors */
  --rabbitbrush: #d49b27;
  --sand: #c2b28f;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
}

a { color: inherit; text-decoration: none; }

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top left, rgba(0,0,0,0.015), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(0,0,0,0.025), transparent 60%),
    var(--paper);
}

/* Header */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 18px 32px;
  border-bottom: 1.5px solid var(--contour-dark);
  background: var(--paper);
  position: relative;
  z-index: 10;
}
.hdr-left { display: flex; align-items: center; gap: 24px; }

.counter {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--contour-dark);
  background: var(--paper-deep);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.counter:hover {
  border-color: var(--ink);
  background: #dce2da;
}
.counter-num { font-size: 20px; font-weight: 700; color: var(--rabbitbrush); text-shadow: 0 0 1px rgba(41,48,44,0.4); }
.counter-div { color: var(--contour); }
.counter-total { font-size: 16px; font-weight: 600; color: var(--ink); }
.counter-label { margin-left: 6px; color: var(--ink-soft); font-size: 10px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: transparent;
  border: 1px solid transparent;
  padding: 8px 14px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.nav a:hover { color: var(--ink); border-color: var(--contour); }
.nav a.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Main Content */
.content-container {
  max-width: 1140px;
  margin: 0 auto;
  padding: 56px 32px 88px;
  width: 100%;
}

.page-intro {
  max-width: 680px;
  margin-bottom: 36px;
}

.page-intro h1 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0 0 12px;
  color: var(--ink);
}

.page-intro p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-soft);
  margin: 0;
}

/* Quick Year Jump Bar */
.year-jump-bar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 14px 16px;
  margin-bottom: 48px;
  background: var(--paper-deep);
  border: 1px solid var(--contour-dark);
}

.year-jump-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  margin-right: 6px;
}

.year-jump-link {
  font-family: var(--font-mono);
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  border: 1px solid var(--contour);
  background: var(--paper);
  color: var(--ink);
  transition: all 0.15s ease;
}

.year-jump-link:hover {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

/* Year Sections */
.reports-timeline {
  display: flex;
  flex-direction: column;
  gap: 56px;
}

.year-section {
  scroll-margin-top: 24px;
}

.year-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 12px;
  margin-bottom: 22px;
  border-bottom: 1.5px solid var(--contour-dark);
}

.year-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0;
  color: var(--ink);
}

.year-count {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
}

/* Report Card Grid */
.reports-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.report-btn {
  display: flex;
  flex-direction: column;
  background: var(--paper-deep);
  border: 1px solid var(--contour-dark);
  overflow: hidden;
  transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.22s ease;
}

.report-btn:hover,
.report-btn:focus-visible {
  transform: translateY(-3px);
  background: #ebeae4;
  border-color: var(--ink);
  box-shadow: 4px 4px 0 var(--contour-dark);
}

.report-thumb {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  background: #c8d0c7;
  border-bottom: 1px solid var(--contour);
  overflow: hidden;
}

.report-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.report-btn:hover .report-thumb img {
  transform: scale(1.03);
}

/* Clean contour placeholder when a thumbnail hasn't been dropped in yet */
.report-thumb-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--contour-dark);
  background:
    repeating-linear-gradient(
      -45deg,
      rgba(92, 107, 97, 0.05),
      rgba(92, 107, 97, 0.05) 8px,
      transparent 8px,
      transparent 16px
    ),
    var(--paper);
}

.report-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 18px 20px 18px;
}

.report-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink);
  margin-bottom: 8px;
}

.report-title {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 500;
  line-height: 1.2;
  letter-spacing: -0.015em;
  color: var(--ink);
  margin: 0 0 8px;
}

.report-excerpt {
  font-size: 13.5px;
  line-height: 1.55;
  color: var(--ink-soft);
  margin: 0 0 16px;
}

.report-cta {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 10px;
  border-top: 1px solid var(--contour);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink);
  transition: color 0.15s ease;
}

.report-btn:hover .report-cta {
  color: var(--ink);
}

/* Responsive Breakpoints */
@media (max-width: 960px) {
  .reports-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 820px) {
  .counter-label { display: none; }
  .hdr { padding: 14px 20px; flex-direction: column; align-items: stretch; gap: 10px; }
  .hdr-left { justify-content: space-between; }
  .nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .nav a { padding: 7px 10px; font-size: 11px; }
  .content-container { padding: 36px 20px 64px; }
}

@media (max-width: 600px) {
  .reports-grid {
    grid-template-columns: 1fr;
  }
}
</style>
<script data-goatcounter="https://skiingthebasin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-left">
      <a class="counter" href="peaks.html" aria-label="Skied project peaks progress">
        <span class="counter-num" id="cNum">–</span><span class="counter-div">/</span><span class="counter-total" id="cTot">64</span>
        <span class="counter-label">skied project peaks</span>
      </a>
    </div>
    <!-- Existing site nav kept unchanged while reports.html is private/unlinked -->
    <nav class="nav">
      <a href="index.html">The Project</a>
      <a href="peaks.html">The Peaks</a>
      <a href="people.html">The People</a>
      <a href="supporters.html">Supporters</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="content-container">
    <div class="page-intro">
      <h1>Trip Reports</h1>
    </div>

    <!-- Auto-populated jump links for active years -->
    <nav class="year-jump-bar" id="yearJumpBar" aria-label="Jump to year"></nav>

    <!-- Auto-populated chronological year sections -->
    <div class="reports-timeline" id="reportsTimeline"></div>
  </main>
</div>

<script>
// Ordered buckets from newest down to 2018, ending with Archival
const REPORT_SECTIONS = [
  { id: '2026', label: '2026' },
  { id: '2025', label: '2025' },
  { id: '2024', label: '2024' },
  { id: '2023', label: '2023' },
  { id: '2022', label: '2022' },
  { id: '2021', label: '2021' },
  { id: '2020', label: '2020' },
  { id: '2019', label: '2019' },
  { id: '2018', label: '2018' },
  { id: 'archival', label: 'Archival' }
];

// Add each new or migrated report here as a single entry.
// Sections with 0 reports automatically stay hidden until you populate them.
const TRIP_REPORTS = [
  {
    year: '2026',
    title: 'Alta Toquima Traverse',
    range: 'Toquima Range, NV',
    date: 'May 4, 2026',
    summary: 'Linking Mt. Jefferson&#39;s Summits',
    thumb: 'images/reports/alta_toquima_traverse/hero.webp', // e.g. 'images/reports/alta-toquima-traverse/thumb.webp'
    href: 'reports/alta_toquima_traverse.html'
  },
  {
    year: '2023',
    title: 'Sample 2023 Report',
    range: 'Ruby Mountains, NV',
    date: 'April 2023',
    summary: 'Placeholder card—swap in title, range, thumbnail path, and report link.',
    thumb: '',
    href: 'reports/sample-2023.html'
  },
  {
    year: '2018',
    title: 'Sample 2018 Report',
    range: 'Snake Range, NV',
    date: 'May 2018',
    summary: 'Placeholder card—swap in title, range, thumbnail path, and report link.',
    thumb: '',
    href: 'reports/sample-2018.html'
  },
  {
    year: 'archival',
    title: 'Sample Archival Dispatch',
    range: 'Great Basin',
    date: 'Archive',
    summary: 'Older trips, oddball side missions, and pre-2018 field notes.',
    thumb: '',
    href: 'reports/sample-archival.html'
  }
];

(function renderReportsIndex() {
  const jumpBar = document.getElementById('yearJumpBar');
  const timeline = document.getElementById('reportsTimeline');
  if (!jumpBar || !timeline) return;

  const jumpLabel = document.createElement('span');
  jumpLabel.className = 'year-jump-label';
  jumpLabel.textContent = 'Jump to:';
  jumpBar.appendChild(jumpLabel);

  REPORT_SECTIONS.forEach((sec) => {
    const items = TRIP_REPORTS.filter(r => r.year === sec.id);
    if (items.length === 0) return;

    // Add jump pill
    const jumpLink = document.createElement('a');
    jumpLink.className = 'year-jump-link';
    jumpLink.href = `#year-${sec.id}`;
    jumpLink.textContent = sec.label;
    jumpBar.appendChild(jumpLink);

    // Build year section
    const sectionEl = document.createElement('section');
    sectionEl.className = 'year-section';
    sectionEl.id = `year-${sec.id}`;
    sectionEl.setAttribute('aria-label', `${sec.label} Trip Reports`);

    const countText = items.length === 1 ? '1 Report' : `${items.length} Reports`;

    sectionEl.innerHTML = `
      <div class="year-header">
        <h2 class="year-title">${sec.label}</h2>
        <span class="year-count">${countText}</span>
      </div>
      <div class="reports-grid"></div>
    `;

    const grid = sectionEl.querySelector('.reports-grid');

    items.forEach((report) => {
      const card = document.createElement('a');
      card.className = 'report-btn';
      card.href = report.href;

      const thumbMarkup = report.thumb
        ? `<img src="${report.thumb}" alt="${report.title}" loading="lazy">`
        : `<div class="report-thumb-placeholder">Photo Pending</div>`;

      card.innerHTML = `
        <div class="report-thumb">
          ${thumbMarkup}
        </div>
        <div class="report-body">
          <div>
            <div class="report-meta">
              <span>${report.range}</span>
              <span>${report.date}</span>
            </div>
            <h3 class="report-title">${report.title}</h3>
            <p class="report-excerpt">${report.summary}</p>
          </div>
          <span class="report-cta">
            <span>Read Report</span>
            <span aria-hidden="true">&#8594;</span>
          </span>
        </div>
      `;

      grid.appendChild(card);
    });

    timeline.appendChild(sectionEl);
  });
})();

// Sync Skied Project Peaks Counter with peaks.html
(async function syncPeakCounter() {
  try {
    const res = await fetch('peaks.html', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/const\s+RAW\s*=\s*(\[[\s\S]*?\n\]);/);
    if (!match) return;
    const rawRows = Function(`"use strict"; return (${match[1]});`)();
    const normalized = rawRows.map(r => r[2] || 'u');
    const nS = normalized.filter(st => st === 's').length;
    const nU = normalized.filter(st => st === 'u').length;
    document.getElementById('cNum').textContent = nS;
    document.getElementById('cTot').textContent = nS + nU;
  } catch {
    // Graceful fallback when opened locally over file://
  }
})();
</script>
</body>
</html>
