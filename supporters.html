<!-- Inside <main class="content-container">, replace the .partners-grid section with this -->
<div class="partners-stage" id="partnersStage">
  <div class="palante-strip-banner" id="palanteBanner" aria-hidden="true">
    <video
      id="palanteStripVideo"
      src="images/palante_banner.mp4"
      muted
      loop
      playsinline
      preload="metadata"
    ></video>
  </div>

  <section class="partners-grid" id="partnersGrid" aria-label="Supporting Brands">
    <!-- Slot 0: Pa'lante (trigger) -->
    <article class="partner-card is-palante" data-partner="palante" tabindex="0">
      <div class="partner-inner">
        <div class="partner-face partner-front">
          <div class="partner-top">
            <a class="partner-ext" href="https://palantepacks.com/" target="_blank" rel="noopener noreferrer" aria-label="Visit Pa'lante Packs website">&#8599;</a>
          </div>
          <div class="partner-logo-wrap">
            <img src="images/palante_logo.png" alt="Pa'lante Packs">
          </div>
          <div class="partner-mission">
            <span class="partner-mission-label">What I use</span>
            <p>Snow pack, sidebag for the camera, and turtle pack for MTB rides</p>
          </div>
        </div>
      </div>
    </article>

    <!-- Slot 1: Arc'teryx (flips to Product 1 when Pa'lante is active) -->
    <article class="partner-card" data-slot="0" tabindex="0">
      <div class="partner-inner">
        <div class="partner-face partner-front">
          <div class="partner-top">
            <a class="partner-ext" href="https://arcteryx.com/us/en" target="_blank" rel="noopener noreferrer" aria-label="Visit Arc'teryx website">&#8599;</a>
          </div>
          <div class="partner-logo-wrap">
            <img src="images/arcteryx_logo.png" alt="Arc'teryx">
          </div>
          <div class="partner-mission">
            <span class="partner-mission-label">What I use</span>
            <p>Outerwear and midlayers to keep the bitter air at bay</p>
          </div>
        </div>
        <div class="partner-face partner-back"></div>
      </div>
    </article>

    <!-- Slot 2: CAMP (flips to Product 2 when Pa'lante is active) -->
    <article class="partner-card" data-slot="1" tabindex="0">
      <div class="partner-inner">
        <div class="partner-face partner-front">
          <div class="partner-top">
            <a class="partner-ext" href="https://www.camp.it/" target="_blank" rel="noopener noreferrer" aria-label="Visit CAMP website">&#8599;</a>
          </div>
          <div class="partner-logo-wrap">
            <img src="images/camp_logo.png" alt="CAMP">
          </div>
          <div class="partner-mission">
            <span class="partner-mission-label">What I use</span>
            <p>All the spikey and stringy bits (crampons, ice axe, harness, etc)</p>
          </div>
        </div>
        <div class="partner-face partner-back"></div>
      </div>
    </article>

    <!-- Slot 3: Protect Our Winters (flips to Product 3 when Pa'lante is active) -->
    <article class="partner-card" data-slot="2" tabindex="0">
      <div class="partner-inner">
        <div class="partner-face partner-front">
          <div class="partner-top">
            <a class="partner-ext" href="https://protectourwinters.org/" target="_blank" rel="noopener noreferrer" aria-label="Visit Protect Our Winters website">&#8599;</a>
          </div>
          <div class="partner-logo-wrap">
            <img src="images/pow_logo.png" alt="Protect Our Winters">
          </div>
          <div class="partner-mission">
            <span class="partner-mission-label">Mission</span>
            <p>Climate action everyone can get behind</p>
          </div>
        </div>
        <div class="partner-face partner-back"></div>
      </div>
    </article>
  </section>
</div>
