<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact · Skiing the Basin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Sage Gray-Green Great Basin Palette */
  --paper: #e3e7e2;
  --paper-deep: #d4dad3;
  --ink: #29302c;
  --ink-soft: #48524c;
  --contour: #95a399;
  --contour-dark: #5c6b61;
  --accent: #8c3b32;
  --accent-soft: #a86259;
  --water: #9ab0b8;

  /* Peak Marker Colors */
  --rabbitbrush: #d49b27;
  --sand: #c2b28f;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
}

a { color: inherit; text-decoration: none; }

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top left, rgba(0,0,0,0.015), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(0,0,0,0.025), transparent 60%),
    var(--paper);
}

/* Header */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 18px 32px;
  border-bottom: 1.5px solid var(--contour-dark);
  background: var(--paper);
  position: relative;
  z-index: 10;
}
.hdr-left { display: flex; align-items: center; gap: 24px; }

/* Skied Progress Box */
.counter {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--contour-dark);
  background: var(--paper-deep);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.counter:hover {
  border-color: var(--ink);
  background: #dce2da;
}
.counter-num { font-size: 20px; font-weight: 700; color: var(--rabbitbrush); text-shadow: 0 0 1px rgba(41,48,44,0.4); }
.counter-div { color: var(--contour); }
.counter-total { font-size: 16px; font-weight: 600; color: var(--ink); }
.counter-label { margin-left: 6px; color: var(--ink-soft); font-size: 10px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: transparent;
  border: 1px solid transparent;
  padding: 8px 14px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.nav a:hover { color: var(--ink); border-color: var(--contour); }
.nav a.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Main Contact Layout */
.contact-main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 32px;
}

.contact-panel {
  width: 100%;
  max-width: 560px;
  background: var(--paper-deep);
  border: 1px solid var(--contour);
  border-left: 4px solid var(--accent);
  padding: 36px 40px;
}

.contact-kicker {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--contour-dark);
  margin: 0 0 10px;
}

.contact-panel h1 {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.15;
  margin: 0 0 8px;
  color: var(--ink);
}

.contact-location {
  font-family: var(--font-mono);
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  margin: 0 0 28px;
}

.contact-email {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 15px;
  color: var(--accent);
  font-weight: 600;
  padding-bottom: 3px;
  border-bottom: 1.5px solid var(--accent-soft);
  transition: color 0.15s ease, border-color 0.15s ease;
  overflow-wrap: anywhere;
}

.contact-email:hover {
  color: var(--ink);
  border-color: var(--ink);
}

@media (max-width: 820px) {
  .counter-label { display: none; }
  .hdr { padding: 14px 20px; flex-direction: column; align-items: stretch; gap: 10px; }
  .hdr-left { justify-content: space-between; }
  .nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .nav a { padding: 7px 10px; font-size: 11px; }
  .contact-main { padding: 40px 20px; }
  .contact-panel { padding: 28px 24px; }
  .contact-panel h1 { font-size: 30px; }
}
</style>
<script data-goatcounter="https://skiingthebasin.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-left">
      <a class="counter" href="peaks.html" aria-label="Skied project peaks progress">
        <span class="counter-num" id="cNum">–</span><span class="counter-div">/</span><span class="counter-total" id="cTot">64</span>
        <span class="counter-label">skied project peaks</span>
      </a>
    </div>
    <nav class="nav">
      <a href="index.html">The Project</a>
      <a href="peaks.html">The Peaks</a>
      <a href="people.html">The People</a>
      <a href="supporters.html">Supporters</a>
      <a class="active" href="contact.html" aria-current="page">Contact</a>
    </nav>
  </header>

  <main class="contact-main">
    <section class="contact-panel" aria-label="Contact information">
      <p class="contact-kicker">Reach out</p>
      <h1>Conor Phelan</h1>
      <p class="contact-location">Reno, NV</p>
      <a class="contact-email" href="mailto:skiingthebasin@gmail.com">skiingthebasin@gmail.com</a>
    </section>
  </main>
</div>

<script>
(async function syncPeakCounter() {
  try {
    const res = await fetch('peaks.html', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/const\s+RAW\s*=\s*(\[[\s\S]*?\n\]);/);
    if (!match) return;
    const rawRows = Function(`"use strict"; return (${match[1]});`)();
    const normalized = rawRows.map(r => r[2] || 'u');
    const nS = normalized.filter(st => st === 's').length;
    const nU = normalized.filter(st => st === 'u').length;
    document.getElementById('cNum').textContent = nS;
    document.getElementById('cTot').textContent = nS + nU;
  } catch {
    // Keep default total if opened over file://
  }
})();
</script>
</body>
</html>
