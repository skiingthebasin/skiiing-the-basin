<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  /* Sage Gray-Green Great Basin Palette */
  --paper: #e3e7e2;
  --paper-deep: #d4dad3;
  --ink: #29302c;
  --ink-soft: #48524c;
  --contour: #95a399;
  --contour-dark: #5c6b61;
  --accent: #8c3b32;
  --accent-soft: #a86259;
  --water: #9ab0b8;

  /* Peak Marker Colors */
  --rabbitbrush: #d49b27;
  --sand: #c2b28f;

  /* Instant Film Stock */
  --film-stock: #f6f4ed;
  --film-shadow: rgba(41, 48, 44, 0.25);

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100vh;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
}

a { color: inherit; text-decoration: none; }

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top left, rgba(0,0,0,0.015), transparent 60%),
    radial-gradient(ellipse at bottom right, rgba(0,0,0,0.025), transparent 60%),
    var(--paper);
}

/* Header */
.hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 18px 32px;
  border-bottom: 1.5px solid var(--contour-dark);
  background: var(--paper);
  position: relative;
  z-index: 20;
}
.hdr-left { display: flex; align-items: center; gap: 24px; }

.counter {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--contour-dark);
  background: var(--paper-deep);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.counter:hover {
  border-color: var(--ink);
  background: #dce2da;
}
.counter-num { font-size: 20px; font-weight: 700; color: var(--rabbitbrush); text-shadow: 0 0 1px rgba(41,48,44,0.4); }
.counter-div { color: var(--contour); }
.counter-total { font-size: 16px; font-weight: 600; color: var(--ink); }
.counter-label { margin-left: 6px; color: var(--ink-soft); font-size: 10px; }

.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a {
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  background: transparent;
  border: 1px solid transparent;
  padding: 8px 14px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.nav a:hover { color: var(--ink); border-color: var(--contour); }
.nav a.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Main Container */
.content-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 48px 32px 80px;
  width: 100%;
}

.page-header-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 36px;
}

.page-intro {
  max-width: 680px;
}

.page-intro h1 {
  font-family: var(--font-display);
  font-size: 38px;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin: 0 0 10px;
  color: var(--ink);
}

.page-intro p {
  font-size: 16px;
  line-height: 1.65;
  color: var(--ink-soft);
  margin: 0;
}

/* Split Workspace: Scattered Tabletop + Specimen Detail Panel */
.people-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 28px;
  align-items: start;
}

/* Scattered Polaroid Sidetable on Macro Rock Texture */
.polaroid-table {
  position: relative;
  width: 100%;
  background:
    linear-gradient(rgba(227, 231, 226, 0.34), rgba(212, 218, 211, 0.44)),
    url('images/texture.webp') center / cover no-repeat,
    var(--paper-deep);
  border: 1.5px solid var(--contour-dark);
  overflow: hidden;
  padding: 24px;
}

/* Subtle coordinate/tabletop bar */
.table-caption-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink);
  background: rgba(227, 231, 226, 0.78);
  padding: 8px 12px;
  margin-bottom: 14px;
  border: 1px solid var(--contour);
  position: relative;
  z-index: 2;
}

.polaroid-field {
  position: relative;
  width: 100%;
  /* Height set dynamically via JS based on row count */
  min-height: 760px;
  z-index: 2;
}

/* Individual Instant-Film Polaroid */
.polaroid-card {
  position: absolute;
  width: 158px;
  background: var(--film-stock);
  padding: 8px 8px 24px;
  border: 1px solid rgba(41, 48, 44, 0.22);
  box-shadow: 0 9px 20px var(--film-shadow), 0 2px 5px rgba(0, 0, 0, 0.12);
  cursor: pointer;
  user-select: none;
  transform: translate(var(--jx, 0px), var(--jy, 0px)) rotate(var(--rot, 0deg));
  transition:
    transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
    box-shadow 0.25s ease,
    border-color 0.2s ease;
  will-change: transform;
}

.polaroid-card:hover,
.polaroid-card:focus-visible {
  z-index: 50 !important;
  transform: translate(var(--jx, 0px), calc(var(--jy, 0px) - 6px)) rotate(0deg) scale(1.14);
  box-shadow: 0 18px 32px rgba(41, 48, 44, 0.34), 0 2px 6px rgba(0, 0, 0, 0.16);
  border-color: var(--ink);
  outline: none;
}

.polaroid-card.is-selected {
  z-index: 45 !important;
  border-color: var(--accent);
  box-shadow: 0 14px 26px rgba(140, 59, 50, 0.26), 0 0 0 2px var(--accent);
}

.polaroid-photo-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #2c332f;
  overflow: hidden;
}

/* Instant-film analog color & edge vignette */
.polaroid-photo-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 16px rgba(26, 22, 18, 0.28);
  pointer-events: none;
}

.polaroid-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  display: block;
  filter: contrast(1.07) brightness(1.03) saturate(0.84) sepia(0.13);
}

.polaroid-missing {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px;
  text-align: center;
  background: #38413c;
  color: var(--paper);
  font-family: var(--font-mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* Hover Quick-Read Strip on Polaroid Chin */
.polaroid-chin {
  padding-top: 6px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  min-height: 18px;
}

.polaroid-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  opacity: 0.35;
  transition: opacity 0.2s ease, color 0.2s ease;
}

.polaroid-peaks-pill {
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 700;
  color: var(--paper);
  background: var(--accent);
  padding: 1px 5px;
  border-radius: 2px;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(2px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.polaroid-card:hover .polaroid-name,
.polaroid-card:focus-visible .polaroid-name,
.polaroid-card.is-selected .polaroid-name {
  opacity: 1;
  color: var(--ink);
}

.polaroid-card:hover .polaroid-peaks-pill,
.polaroid-card:focus-visible .polaroid-peaks-pill,
.polaroid-card.is-selected .polaroid-peaks-pill {
  opacity: 1;
  transform: translateY(0);
}

/* Sticky Specimen Side Panel */
.specimen-panel {
  position: sticky;
  top: 28px;
  background: var(--paper-deep);
  border: 1.5px solid var(--contour-dark);
  padding: 24px;
}

.specimen-empty {
  padding: 44px 16px;
  text-align: center;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 20px;
  line-height: 1.45;
  color: var(--ink-soft);
}

.specimen-photo-frame {
  background: var(--film-stock);
  padding: 10px 10px 26px;
  border: 1px solid rgba(41, 48, 44, 0.2);
  box-shadow: 0 10px 20px rgba(41, 48, 44, 0.16);
  margin-bottom: 18px;
}

.specimen-photo-frame img {
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  object-position: center 20%;
  display: block;
  filter: contrast(1.06) brightness(1.02) saturate(0.88) sepia(0.1);
}

.specimen-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}

.specimen-name {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin: 0;
  color: var(--ink);
}

.specimen-count {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--paper);
  background: var(--accent);
  padding: 4px 8px;
  white-space: nowrap;
}

.specimen-peaks-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--ink-soft);
  margin: 0 0 8px;
}

.specimen-peak-list {
  list-style: none;
  padding: 0;
  margin: 0;
  border-top: 1px solid var(--contour);
  max-height: 280px;
  overflow-y: auto;
}

.specimen-peak-list li {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink);
  padding: 6px 2px;
  border-bottom: 1px solid var(--contour);
  display: flex;
  align-items: center;
  justify-content: flex-start;
}

.specimen-peak-list li::before {
  content: "▲";
  font-size: 8px;
  color: var(--rabbitbrush);
  margin-right: 8px;
}

/* Responsive Breakpoints */
@media (max-width: 1020px) {
  .people-workspace {
    grid-template-columns: 1fr;
  }

  .specimen-panel {
    position: static;
  }
}

@media (max-width: 820px) {
  .counter-label { display: none; }
  .hdr { padding: 14px 20px; flex-direction: column; align-items: stretch; gap: 10px; }
  .hdr-left { justify-content: space-between; }
  .nav { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
  .nav a { padding: 7px 10px; font-size: 11px; }
  .content-container { padding: 36px 20px 64px; }
  .polaroid-table { padding: 16px; }
  .polaroid-card { width: 126px; padding: 6px 6px 20px; }
}
</style>

(function initPolaroidTable() {
  const field = document.getElementById('polaroidField');
  const countLabel = document.getElementById('peopleCountLabel');
  if (!field) return;

  if (countLabel) countLabel.textContent = PEOPLE.length;

  const specimenEmpty = document.getElementById('specimenEmpty');
  const specimenContent = document.getElementById('specimenContent');
  const specimenImg = document.getElementById('specimenImg');
  const specimenName = document.getElementById('specimenName');
  const specimenCount = document.getElementById('specimenCount');
  const specimenPeakList = document.getElementById('specimenPeakList');

  const randRange = (min, max) => Math.random() * (max - min) + min;

  function selectPerson(person, cardEl) {
    if (!person) return;

    field.querySelectorAll('.polaroid-card').forEach(c => c.classList.remove('is-selected'));
    if (cardEl) cardEl.classList.add('is-selected');

    if (specimenEmpty) specimenEmpty.style.display = 'none';
    if (specimenContent) specimenContent.style.display = 'block';
    if (specimenName) specimenName.textContent = person.name;

    const n = person.peaks.length;
    if (specimenCount) {
      specimenCount.textContent = `${n} ${n === 1 ? 'Peak' : 'Peaks'}`;
    }

    if (specimenImg) {
      specimenImg.style.display = 'block';
      specimenImg.onerror = () => {
        specimenImg.style.display = 'none';
      };
      specimenImg.alt = `${person.name} portrait`;
      specimenImg.src = `images/people/${person.img}`;
    }

    if (specimenPeakList) {
      specimenPeakList.innerHTML = person.peaks
        .map(peak => `<li>${peak}</li>`)
        .join('');
    }
  }

  function renderScatter() {
    field.innerHTML = '';

    const fieldWidth = field.clientWidth || 820;
    const isMobile = window.innerWidth <= 820;
    const cardW = isMobile ? 126 : 158;
    const cardH = isMobile ? 196 : 238;

    // Overlap cells slightly so prints pile naturally like a wedding sidetable
    const stepX = Math.max(cardW * 0.72, 92);
    const stepY = Math.max(cardH * 0.68, 125);
    const cols = Math.max(2, Math.floor((fieldWidth - cardW * 0.5) / stepX));
    const usableWidth = Math.max(cardW, cols * stepX);
    const offsetLeft = Math.max(0, (fieldWidth - usableWidth) / 2);

    const rows = Math.ceil(PEOPLE.length / cols);
    const totalHeight = rows * stepY + cardH * 0.48;
    field.style.height = `${Math.max(540, Math.round(totalHeight))}px`;

    PEOPLE.forEach((person, idx) => {
      const col = idx % cols;
      const row = Math.floor(idx / cols);

      // Stagger alternating rows slightly for a more organic pile
      const rowShift = (row % 2 === 1) ? stepX * 0.25 : 0;
      const baseX = offsetLeft + col * stepX + rowShift;
      const baseY = row * stepY + 12;

      const jitterX = randRange(-14, 14);
      const jitterY = randRange(-14, 14);
      const clampedX = Math.max(4, Math.min(fieldWidth - cardW - 4, baseX + jitterX));
      const clampedY = Math.max(4, baseY + jitterY);
      const rot = randRange(-11, 11).toFixed(1);
      const zBase = 2 + (idx % 25);

      const card = document.createElement('article');
      card.className = 'polaroid-card';
      card.tabIndex = 0;
      card.style.left = `${Math.round(clampedX)}px`;
      card.style.top = `${Math.round(clampedY)}px`;
      card.style.zIndex = String(zBase);
      card.style.setProperty('--rot', `${rot}deg`);
      card.style.setProperty('--jx', '0px');
      card.style.setProperty('--jy', '0px');

      const peakCount = person.peaks.length;
      const peakLabel = `${peakCount} ${peakCount === 1 ? 'Peak' : 'Peaks'}`;

      card.innerHTML = `
        <div class="polaroid-photo-wrap">
          <img src="images/people/${person.img}" alt="${person.name}" loading="lazy">
        </div>
        <div class="polaroid-chin">
          <span class="polaroid-name">${person.name}</span>
          <span class="polaroid-peaks-pill">${peakLabel}</span>
        </div>
      `;

      const img = card.querySelector('img');
      img.addEventListener('error', () => {
        const wrap = card.querySelector('.polaroid-photo-wrap');
        if (wrap && !wrap.querySelector('.polaroid-missing')) {
          img.style.display = 'none';
          const fallback = document.createElement('div');
          fallback.className = 'polaroid-missing';
          fallback.innerHTML = `<strong>${person.name}</strong><span>${person.img}</span>`;
          wrap.appendChild(fallback);
        }
      });

      card.addEventListener('click', () => selectPerson(person, card));
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectPerson(person, card);
        }
      });

      field.appendChild(card);
    });
  }

  renderScatter();

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderScatter, 150);
  });
})();

// Sync Skied Project Peaks Counter with peaks.html
(async function syncPeakCounter() {
  try {
    const res = await fetch('peaks.html', { cache: 'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const match = text.match(/const\s+RAW\s*=\s*(\[[\s\S]*?\n\]);/);
    if (!match) return;
    const rawRows = Function(`"use strict"; return (${match[1]});`)();
    const normalized = rawRows.map(r => r[2] || 'u');
    const nS = normalized.filter(st => st === 's').length;
    const nU = normalized.filter(st => st === 'u').length;
    document.getElementById('cNum').textContent = nS;
    document.getElementById('cTot').textContent = nS + nU;
  } catch {
    // Graceful fallback when opened locally over file://
  }
})();
</script>
