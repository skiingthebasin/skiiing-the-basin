<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Peaks · Skiing the Basin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Sage Gray-Green Great Basin Palette */
  --paper: #e3e7e2; 
  --paper-deep: #d4dad3; 
  --ink: #29302c; 
  --ink-soft: #48524c;
  --contour: #95a399; 
  --contour-dark: #5c6b61; 
  --accent: #8c3b32; 
  --accent-soft: #a86259; 
  --water: #9ab0b8;

  /* Peak Marker Colors */
  --rabbitbrush: #d49b27;
  --sand: #c2b28f;

  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Inter", -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; font-family: var(--font-body); color: var(--ink); background: var(--paper); }
a { color: inherit; }
.app { height: 100vh; display: flex; flex-direction: column;
  background: radial-gradient(ellipse at top left, rgba(0,0,0,0.015), transparent 60%), radial-gradient(ellipse at bottom right, rgba(0,0,0,0.025), transparent 60%), var(--paper); }
.app::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 1;
  background-image: repeating-linear-gradient(0deg, transparent 0, transparent 2px, rgba(0,0,0,0.008) 2px, rgba(0,0,0,0.008) 3px), repeating-linear-gradient(90deg, transparent 0, transparent 2px, rgba(0,0,0,0.008) 2px, rgba(0,0,0,0.008) 3px); }

/* Header */
.hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 18px 32px; border-bottom: 1.5px solid var(--contour-dark); background: var(--paper); position: relative; z-index: 10; }
.hdr::after { content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 1px; background: var(--contour-dark); opacity: 0.4; }
.hdr-left { display: flex; align-items: center; gap: 24px; }
.wordmark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; }
.wm-mono { font-family: var(--font-mono); font-size: 22px; font-weight: 700; letter-spacing: 0.05em; }
.wm-divider { color: var(--contour); font-size: 18px; }
.wm-name { font-family: var(--font-display); font-size: 18px; font-style: italic; color: var(--ink-soft); letter-spacing: -0.01em; white-space: nowrap; }
.counter { display: flex; align-items: baseline; gap: 6px; padding: 6px 14px; border: 1px solid var(--contour-dark); background: var(--paper-deep); font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.counter-num { font-size: 20px; font-weight: 700; color: var(--rabbitbrush); text-shadow: 0 0 1px rgba(41,48,44,0.4); }
.counter-div { color: var(--contour); }
.counter-total { font-size: 16px; font-weight: 600; }
.counter-label { margin-left: 6px; color: var(--ink-soft); font-size: 10px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a, .tab { font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; background: transparent; border: 1px solid transparent; padding: 8px 14px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s ease; white-space: nowrap; text-decoration: none; }
.nav a:hover, .tab:hover { color: var(--ink); border-color: var(--contour); }
.nav a.active, .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Sub bar */
.subbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 32px; border-bottom: 1px solid var(--contour); background: var(--paper); position: relative; z-index: 5; }
.subbar-title { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; }
.subbar-title em { font-size: 14px; color: var(--ink-soft); margin-left: 10px; }
.tabs { display: flex; gap: 4px; }

main { flex: 1; min-height: 0; position: relative; z-index: 2; display: flex; flex-direction: column; }
main > * { flex: 1; min-height: 0; }
[hidden] { display: none !important; }

/* Map view */
.map-view { display: grid; grid-template-columns: 1fr 420px; height: 100%; }
.map-wrap { position: relative; overflow: hidden; border-right: 1.5px solid var(--contour-dark); display: flex; min-height: 0; }
.map-wrap > svg { flex: 1; width: 100%; height: 100%; min-height: 0; cursor: grab; touch-action: none; user-select: none; }
.map-wrap > svg.dragging { cursor: grabbing; }
.corners { position: absolute; inset: 12px; pointer-events: none; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.05em; color: var(--ink-soft); }
.corners div { position: absolute; }
.c-tl { top: 0; left: 0; } .c-tr { top: 0; right: 0; } .c-bl { bottom: 0; left: 0; } .c-br { bottom: 0; right: 0; }
.zoom { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 30px; height: 30px; background: var(--paper); border: 1px solid var(--contour-dark); font-family: var(--font-mono); font-size: 15px; color: var(--ink-soft); cursor: pointer; transition: all 0.15s; }
.zoom button:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.compass { position: absolute; top: 34px; right: 16px; pointer-events: none; }
.scale { position: absolute; left: 16px; bottom: 34px; font-family: var(--font-mono); font-size: 9px; color: var(--ink-soft); pointer-events: none; }
.scale-bar { height: 5px; border: 1px solid var(--ink-soft); border-top: none; margin-top: 3px; }
.scale-row { display: flex; justify-content: space-between; }
.legend { position: absolute; bottom: 34px; right: 20px; background: var(--paper); border: 1px solid var(--contour-dark); padding: 12px 16px; font-family: var(--font-mono); font-size: 11px; }
.legend-row { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); margin-bottom: 6px; }
.legend-row:last-child { margin-bottom: 0; }
.tooltip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.05em; padding: 5px 9px; white-space: nowrap; transform: translate(-50%, -150%); z-index: 20; }

.state-label { font-family: var(--font-display); font-style: italic; fill: var(--contour-dark); opacity: 0.55; font-size: 15px; letter-spacing: 0.25em; pointer-events: none; }
.grat-label { font-family: var(--font-mono); font-size: 9px; fill: var(--contour-dark); opacity: 0.7; pointer-events: none; }
.peak { cursor: pointer; }
.peak-label { font-family: var(--font-mono); font-size: 7.5px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 2.5px; stroke-linejoin: round; display: none; }
svg.labels .peak-label { display: block; }
.peak .ring { display: none; }
.peak.sel .ring { display: block; }

/* Detail panel */
.panel { background: var(--paper-deep); padding: 32px 28px; overflow-y: auto; position: relative; }
.empty-card { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding-top: 40px; }
.empty-title { font-family: var(--font-display); font-size: 28px; font-weight: 400; margin: 0; letter-spacing: -0.02em; }
.empty-body { font-size: 14px; line-height: 1.55; color: var(--ink-soft); margin: 0; max-width: 320px; }
.panel-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; background: transparent; border: 1px solid var(--contour); cursor: pointer; font-size: 18px; line-height: 1; color: var(--ink-soft); transition: all 0.15s; }
.panel-close:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.panel-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px dashed var(--contour); }
.panel-row { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.code-large { font-family: var(--font-mono); font-size: 22px; font-weight: 700; color: #a67614; line-height: 1; border: 2px solid var(--rabbitbrush); background: rgba(212, 155, 39, 0.12); padding: 6px 10px; }
.code-large.other { color: #7a6d52; border-color: var(--sand); background: rgba(194, 178, 143, 0.18); }
.code-large.unskied { color: var(--ink-soft); border-color: var(--ink-soft); background: transparent; }
.panel-kind { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-soft); margin-bottom: 2px; }
.panel-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; font-weight: 700; color: #9c6e11; }
.panel-status.other { color: #73664b; } .panel-status.unskied { color: var(--ink-soft); }
.panel-name { font-family: var(--font-display); font-size: 36px; font-weight: 400; margin: 0 0 6px; letter-spacing: -0.02em; line-height: 1.05; }
.panel-coords { font-family: var(--font-display); font-style: italic; font-size: 14px; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--contour); border: 1px solid var(--contour); margin-bottom: 24px; }
.stat { background: var(--paper); padding: 14px 16px; }
.stat.wide { grid-column: 1 / -1; }
.stat-label, .section-label { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-soft); margin-bottom: 4px; }
.stat-value { font-family: var(--font-display); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; }
.stat-unit { font-size: 14px; font-weight: 400; color: var(--ink-soft); margin-left: 3px; }
.stat-text { font-family: var(--font-display); font-size: 17px; font-weight: 500; line-height: 1.3; }
.section-label { font-size: 10px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--contour); }
.photo { display: block; background: var(--paper); border: 1px solid var(--contour-dark); padding: 6px; margin: 0 0 4px; }
.photo img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; filter: saturate(0.9) contrast(1.02); }
.cta { width: 100%; background: var(--ink); color: var(--paper); padding: 16px 20px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.15em; display: flex; justify-content: space-between; align-items: center; margin-top: 20px; transition: all 0.15s; text-decoration: none; }
.cta:hover { background: var(--accent); }
.planned-text { font-family: var(--font-display); font-style: italic; font-size: 16px; line-height: 1.5; color: var(--ink-soft); margin: 0; }

/* Ledger */
.ledger { overflow-y: auto; height: 100%; }
.ledger-inner { max-width: 1200px; margin: 0 auto; padding: 48px 64px 80px; }
.ledger-head { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1.5px solid var(--contour-dark); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 14px; font-weight: 700; }
.ledger-head h1 { font-family: var(--font-display); font-size: 56px; font-weight: 400; letter-spacing: -0.03em; margin: 0 0 20px; line-height: 1; }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--contour); border: 1px solid var(--contour); }
.total { background: var(--paper); padding: 16px 20px; }
.total-num { font-family: var(--font-display); font-size: 44px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
.total-num.acc { color: #b58018; }
.total-label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-soft); margin-top: 6px; }
.filters { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.tab.boxed { border-color: var(--contour); }
table { width: 100%; border-collapse: collapse; }
th { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--ink-soft); text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--contour-dark); font-weight: 500; white-space: nowrap; }
th[data-sort] { cursor: pointer; }
th[data-sort]:hover { color: var(--ink); }
th .arr { color: var(--accent); margin-left: 4px; }
